name: Continuous Integration & Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Data Loader and Model Imports
      run: |
        python -c "from src.data_loader import get_preprocessed_data; from src.models import build_baseline_model_4; print('✅ CI Check Passed: Code structure and modules are sound!')"

  build-docker-image:
    needs: lint-and-validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: |
        docker build -t reuters-classifier:latest .
        print("✅ CD Check Passed: Docker image successfully compiled without errors!")